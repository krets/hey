name: build

# Every push to main, PR, and manual run builds binaries you can download from
# the run's "Artifacts" section. A tag like v0.1.0 also publishes a GitHub
# Release with the archives and checksums attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          # macOS x86_64 is cross-compiled on the arm64 runner (Intel runners are being retired).
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }

      - name: Install Linux toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then
            # ring only needs a C compiler for the target; the gnu cross gcc is enough.
            export CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version=$REF_NAME; else version=${GITHUB_SHA::7}; fi
          ext=""; [[ $TARGET == *windows* ]] && ext=".exe"
          name=hey-$version-$TARGET
          mkdir "$name"
          cp "target/$TARGET/release/hey$ext" README.md "$name/"
          if [ -n "$ext" ]; then
            7z a "$name.zip" "$name" >/dev/null; asset=$name.zip
          else
            tar czf "$name.tar.gz" "$name"; asset=$name.tar.gz
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "asset=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: hey-${{ matrix.target }}
          path: |
            ${{ env.asset }}
            ${{ env.asset }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
