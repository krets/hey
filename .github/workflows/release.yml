name: release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  cross: true }
          - { target: x86_64-apple-darwin,        os: macos-13 }
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = true ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          name=hey-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/hey$ext" README.md "$name/"
          if [ -n "$ext" ]; then 7z a "$name.zip" "$name"; echo "asset=$name.zip" >> "$GITHUB_ENV"
          else tar czf "$name.tar.gz" "$name"; echo "asset=$name.tar.gz" >> "$GITHUB_ENV"; fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.target }}", path: "${{ env.asset }}" }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: "${{ env.asset }}" }
